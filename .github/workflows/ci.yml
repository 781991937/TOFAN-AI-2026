name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Install test runner
        run: python -m pip install pytest
      - name: Compile application
        run: python -m compileall -q app
      - name: Validate frontend JavaScript
        run: |
          node --check web/app.js
          node --check web/assessments.js
          node --check web/student-files.js
          node --check web/subscriptions.js
      - name: Import FastAPI application
        env:
          DATABASE_URL: "sqlite:///./ci.db"
        run: python -c "from app.main import app; print(app.title)"
      - name: Run tests
        env:
          DATABASE_URL: "sqlite:///./ci.db"
        run: |
          set +e
          python -m pytest -q 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          exit $status
      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics
          path: pytest.log
