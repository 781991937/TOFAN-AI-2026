name: Python smoke tests

on:
  push:
    branches: [main, replit-ready]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile Python files
        run: python -m compileall -q app
      - name: Validate frontend JavaScript
        run: |
          node --check web/app.js
          node --check web/assessments.js
          node --check web/student-files.js
          node --check web/subscriptions.js
      - name: Import application and critical modules
        env:
          DATABASE_URL: "sqlite:///./smoke.db"
        run: |
          python -c "from app.main import app; print(app.title); print(len(app.routes))"
          python -c "from app.auth.webauthn import begin_registration, finish_registration, begin_authentication, finish_authentication; from app.agents.main_manager import MainManagerService; from app.agents.teacher import create_curriculum_teacher_agent; print('critical imports OK')"
      - name: Run smoke tests
        env:
          DATABASE_URL: "sqlite:///./smoke.db"
          TOFAN_ENV: development
          TOFAN_STORAGE_BACKEND: local
        run: python -m pytest -q
      - name: Start application and verify web routes
        env:
          DATABASE_URL: "sqlite:///./smoke.db"
          TOFAN_ENV: development
          TOFAN_STORAGE_BACKEND: local
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > smoke-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null && curl -fsSL http://127.0.0.1:8000/ >/dev/null && curl -fsS http://127.0.0.1:8000/web/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat smoke-server.log
          exit 1
