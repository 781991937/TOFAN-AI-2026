name: Python smoke tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile Python files
        run: python -m compileall -q app
      - name: Import application and critical modules
        env:
          DATABASE_URL: "sqlite:///./smoke.db"
        run: |
          python -c "from app.main import app; print(app.title); print(len(app.routes))"
          python -c "from app.auth.webauthn import begin_registration, finish_registration, begin_authentication, finish_authentication; from app.agents.main_manager import MainManagerService; from app.agents.teacher import create_curriculum_teacher_agent; print('critical imports OK')"
      - name: Run smoke tests
        env:
          DATABASE_URL: "sqlite:///./smoke.db"
        run: python -m pytest -q
