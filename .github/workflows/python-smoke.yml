name: Python smoke tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
      - name: Install Poppler build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libpoppler-cpp-dev pkg-config python3-dev
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify PDF stack
        run: python -c "import pdftotext, fitz, pypdf; print('PDF stack OK')"
      - name: Compile Python files
        run: python -m compileall -q app
      - name: Run smoke tests
        run: python -m pytest -q tests/test_runtime_smoke.py
