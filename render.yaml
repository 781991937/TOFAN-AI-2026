services:
  - type: web
    name: TOFAN-AI-2026-1
    runtime: docker
    plan: free
    region: oregon
    repo: https://github.com/781991937/TOFAN-AI-2026.git
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "10000"
      - key: TOFAN_ENV
        value: production
      - key: TOFAN_STORAGE_BACKEND
        value: s3
      - key: TOFAN_S3_REGION
        value: us-east-1
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AUTH_OTP_PEPPER
        sync: false
      - key: WEBAUTHN_RP_ID
        sync: false
      - key: WEBAUTHN_ORIGIN
        sync: false
      - key: TOFAN_S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: TOFAN_S3_ENDPOINT_URL
        sync: false
